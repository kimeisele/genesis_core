name: Frozen Core Check

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]

jobs:
  freeze-check:
    name: Verify Core Modules are Frozen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits to compare

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run freeze verification script
        run: |
          python scripts/verify_frozen.py

      - name: Check for modifications to core modules
        if: github.event_name == 'push'
        run: |
          # List of frozen core modules
          CORE_MODULES="genesis_core/io.py genesis_core/storage.py genesis_core/schema.py genesis_core/entity.py genesis_core/transform.py genesis_core/process.py genesis_core/validation.py genesis_core/identity.py"

          # Check if any core module was modified
          MODIFIED_CORE=""
          for module in $CORE_MODULES; do
            if git diff HEAD~1 HEAD --name-only | grep -q "^${module}$"; then
              MODIFIED_CORE="${MODIFIED_CORE} ${module}"
            fi
          done

          if [ -n "$MODIFIED_CORE" ]; then
            echo "❌ ERROR: Core modules were modified:"
            echo "$MODIFIED_CORE"
            echo ""
            echo "Core modules are FROZEN and must not be changed."
            echo "To add features, create an extension in the extensions/ directory."
            exit 1
          else
            echo "✅ No core modules were modified"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests with pytest
        run: |
          pytest -v --cov=genesis_core --cov-report=term-missing

      - name: Run basic tests
        run: |
          python test_core_basic.py
          python test_all.py

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Check code formatting with black
        run: |
          black --check genesis_core/

      - name: Lint with flake8
        run: |
          flake8 genesis_core/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 genesis_core/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Type check with mypy
        run: |
          mypy genesis_core/ --ignore-missing-imports || true
