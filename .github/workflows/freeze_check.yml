name: Frozen Core Integrity Check

on:
  push:
    branches: ["main", "master", "claude/*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  freeze-integrity:
    name: Verify Core Modules Are Frozen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run freeze integrity tests
        run: |
          python -m pytest tests/test_frozen_integrity.py -v
        id: freeze_check

      - name: Check frozen manifest
        run: |
          python scripts/verify_frozen.py
        id: manifest_check

      - name: Report status
        if: always()
        run: |
          echo "🔒 Frozen Core Integrity Check Complete"
          echo ""
          if [ "${{ steps.freeze_check.outcome }}" == "success" ] && [ "${{ steps.manifest_check.outcome }}" == "success" ]; then
            echo "✅ All core modules are frozen and unmodified"
            exit 0
          else
            echo "🚨 FROZEN CORE VIOLATION DETECTED!"
            echo ""
            echo "Core modules have been modified. This is not allowed."
            echo "See FROZEN_MANIFEST.md for the extension policy."
            echo ""
            echo "To add functionality:"
            echo "  1. Create a new module in extensions/"
            echo "  2. Import and wrap core functions"
            echo "  3. Never modify core directly"
            exit 1
          fi

  test:
    name: Run Core Tests
    runs-on: ubuntu-latest
    needs: freeze-integrity

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=genesis_core --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    needs: freeze-integrity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          mypy genesis_core --ignore-missing-imports || true

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: freeze-integrity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Check code formatting
        run: |
          black --check genesis_core/ tests/ || true
